<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC Clock (12-Hour)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .clock-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 35px 45px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            min-width: 300px;
        }

        .badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .time-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .time {
            font-size: 48px;
            font-weight: 800;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff; /* පැහැදිලිව පෙනෙන පරිදි Solid White ලබා දී ඇත */
        }

        .ampm {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
        }

        .date {
            font-size: 17px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="clock-card">
        <span class="badge">UTC Timezone</span>
        <div class="time-container">
            <span id="utc-time" class="time">00:00:00</span>
            <span id="ampm" class="ampm">AM</span>
        </div>
        <div id="utc-date" class="date">Loading...</div>
    </div>

    <script>
        function updateUTCTime() {
            const now = new Date();

            let hours = now.getUTCHours();
            const minutes = String(now.getUTCMinutes()).padStart(2, '0');
            const seconds = String(now.getUTCSeconds()).padStart(2, '0');

            // AM / PM තීරණය කිරීම
            const ampm = hours >= 12 ? 'PM' : 'AM';

            // 12-hour format එකට පරිවර්තනය
            hours = hours % 12;
            hours = hours ? hours : 12; // පැය 0 අවස්ථාව 12 ලෙස පෙන්වයි
            const formattedHours = String(hours).padStart(2, '0');

            // UTC දිනය, මාසය, වර්ෂය
            const year = now.getUTCFullYear();
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = monthNames[now.getUTCMonth()];
            const day = String(now.getUTCDate()).padStart(2, '0');

            // Text එක HTML එකට ඇතුළත් කිරීම
            const timeElement = document.getElementById('utc-time');
            const ampmElement = document.getElementById('ampm');
            const dateElement = document.getElementById('utc-date');

            if (timeElement && ampmElement && dateElement) {
                timeElement.textContent = `${formattedHours}:${minutes}:${seconds}`;
                ampmElement.textContent = ampm;
                dateElement.textContent = `${day} ${month} ${year}`;
            }
        }

        // DOM එක Load වූ පසු Script එක ක්‍රියාත්මක කිරීම
        document.addEventListener("DOMContentLoaded", function () {
            updateUTCTime();
            setInterval(updateUTCTime, 1000);
        });
    </script>

</body>
</html>
